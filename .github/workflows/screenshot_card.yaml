name: Tool card screenshot
on:
  workflow_run:
    workflows: ["pages-build-deployment"]
    types:
      - completed

jobs:
  screenshot:
    runs-on: ubuntu-latest
    steps:
      - name: Download context
        id: download_context
        continue-on-error: true
        uses: dawidd6/action-download-artifact@v11
        with:
          workflow: checklist.yaml
          name: context

      - name: Exit on missing context
        if: failure()
        run: |
          echo "⚠️ Context artifact not found. Skipping downstream steps."
          exit 0
      
      - name: Load context
        run: |
          cat context.env >> $GITHUB_ENV
          echo "Generating screenshot for $raw_name from $issue_number"
      
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      
      - name: Install Python dependencies
        run: pip install 'selenium>=4.34'

      - name: Configure git
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Generate and commit screenshot
        run: |
          python .github/scripts/card_screenshot.py ${{ env.raw_name }}

          git fetch origin gh-screenshots
          git checkout gh-screenshots

          mv ${{ env.raw_name }}.png screenshots/${{ env.raw_name }}.png
          
          git add screenshots/${{ env.raw_name }}.png
          git commit -m 'Add / update ${{ env.raw_name }} screenshot'
          git push
          
          echo "screenshot_url=https://raw.githubusercontent.com/${{ github.repository }}/gh-screenshots/screenshots/${{ env.raw_name }}.png" >> $GITHUB_ENV
      
      - name: Comment on issue
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ env.issue_number }}
          body: |
            🖼️ **Screenshot of tool card for **${{ env.raw_name }}**:
            ![${{ env.raw_name }} screenshot](${{ env.screenshot_url }})

            🔗 **Screenshot URL**:
            ```
            ${{ env.screenshot_url }}
            ```
          